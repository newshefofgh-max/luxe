name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [gh-pages-demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        # --ignore-scripts skips native builds (better-sqlite3, sharp) and
        # the prisma client postinstall — none of those are reachable in
        # the static demo build, so we skip them to keep the runner fast
        # and avoid environment-specific compile errors.
        run: npm ci --ignore-scripts

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://newshefofgh-max.github.io/luxe
          NEXT_PUBLIC_APP_NAME: Luxe Accessories

      - name: Disable Jekyll on Pages
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
